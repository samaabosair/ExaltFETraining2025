<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create/Edit Event</title>
    <link rel="stylesheet" href="assets/styles/style.css">
    <link rel="stylesheet" href="assets/styles/style2.css">

</head>
<body>
  <!-- Header -->
<header class="site-header">
        <h1>Create/Edit Event</h1>
    </header>

    <div class="container">
     <nav class="sidebar">
        <div class="top-block">
            <ul>
                <li><a href="#" id="list-event"  class="tab-link">List</a></li>
            </ul>
        </div>
          <div class="curve-divider1"></div>
          <div class="curve-divider2"></div>

        <div class="bottom-block">
           <ul>
                <li><a href="#" id="form-event" class="tab-link">Form</a></li>
            </ul>   
         </div>
     </nav>
    <main class="site-main">
        <!-- Event form -->
  <form id="eventForm">
    <label>Event Name:
      <input type="text" id="name" required />
    </label>

    <label>Description:
      <textarea id="description" rows="3" required></textarea>
    </label>

    <label>Date and Time:
      <input type="datetime-local" id="date" required />
    </label>

    <!-- Action buttons -->
    <div class="form-buttons">
      <button type="submit" id="submitBtn">Add</button>
      <button type="button" id="cancelBtn">Cancel</button>
    </div>
  </form>
    </main>
    </div>
    <footer class="site-footer">
        <p>&copy; 2025 Event Management Interface</p>
    </footer>
      <script src="assets/scripts/events.js"></script>
      <script src="assets/scripts/navigate.js"></script>
</body>
</html>
